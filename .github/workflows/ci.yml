name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.8"
          - os: ubuntu-24.04
            python: "3.13"
          - os: windows-2025
            python: "3.13"
          - os: macos-15
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        working-directory: plugins/pipeline-doctor
        run: python -m unittest discover -s tests
      - name: Audit this repository's pipeline
        run: python plugins/pipeline-doctor/skills/audit/scripts/pipeline_doctor.py Jenkinsfile --fail-on low

  action:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: A clean pipeline passes
        uses: ./
        with:
          path: Jenkinsfile
          fail-on: low
      - name: An insecure pipeline fails
        id: insecure
        continue-on-error: true
        uses: ./
        with:
          path: plugins/pipeline-doctor/tests/fixtures/insecure.Jenkinsfile
          format: markdown
          output: report.md
      - name: Check the failure and the report
        shell: bash
        env:
          OUTCOME: ${{ steps.insecure.outcome }}
        run: |
          test "$OUTCOME" = failure
          grep -q PD001 report.md
      - name: Create an empty scan target
        shell: bash
        run: mkdir empty-pipeline-target
      - name: An empty scan fails even with fail-on none
        id: empty
        continue-on-error: true
        uses: ./
        with:
          path: empty-pipeline-target
          fail-on: none
          format: markdown
          output: empty-report.md
      - name: Check the empty scan outcome and report
        shell: bash
        env:
          OUTCOME: ${{ steps.empty.outcome }}
        run: |
          test "$OUTCOME" = failure
          grep -q 'NOT ASSESSED' empty-report.md

  published-action:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The published release works
        uses: svrforge/devops-forge@v1.0.0
        with:
          path: Jenkinsfile
          fail-on: low
