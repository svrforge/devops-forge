x-database-url: &database-url postgresql://shortener:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/shortener

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shortener
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: runtime
    command: ["python", "-m", "shortener.migrate"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: *database-url
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v3.15.1
    volumes:
      - ./monitoring:/etc/prometheus:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
