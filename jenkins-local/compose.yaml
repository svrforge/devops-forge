# Connects a Docker-capable agent to a Jenkins that already runs in a container.
services:
  # Builds run on this private Docker daemon, so they cannot touch your host's
  # containers. It must run privileged, so use this setup for local learning only.
  dind:
    image: docker:29-dind
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: /certs
    networks:
      default:
        aliases:
          - docker # The daemon's TLS certificate is issued for this name.
    volumes:
      - docker-certs-client:/certs/client
      - docker-data:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 3s
      timeout: 5s
      retries: 30

  agent:
    build: .
    init: true
    restart: unless-stopped
    environment:
      JENKINS_URL: ${JENKINS_URL:-http://host.docker.internal:8080}
      JENKINS_SECRET: ${JENKINS_SECRET:?copy the secret from the agent page into .env}
      JENKINS_AGENT_NAME: ${JENKINS_AGENT_NAME:-docker-agent}
      JENKINS_WEB_SOCKET: "true"
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - docker-certs-client:/certs/client:ro
      - agent-workspace:/home/jenkins/agent
    depends_on:
      dind:
        condition: service_healthy

volumes:
  docker-certs-client:
  docker-data:
  agent-workspace:
